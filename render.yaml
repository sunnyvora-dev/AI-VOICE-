services:
  - type: web
    name: voice-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: API_KEY
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./voice_agent.db
      - key: DAILY_REQUEST_LIMIT
        value: "500"
      - key: ALLOWED_ORIGINS
        value: "*"
